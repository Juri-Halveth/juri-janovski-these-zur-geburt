name: Build and verify PDF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    name: Reproducible PDF build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python source
        run: python -m py_compile build_pdf.py

      - name: Build twice and verify deterministic output
        shell: bash
        run: |
          set -euo pipefail
          pdf="output/pdf/JURI_JANOVSKI_THESE_ZUR_GEBURT.pdf"
          checksum="${pdf}.sha256"

          python build_pdf.py
          test -s "$pdf"
          first_hash="$(sha256sum "$pdf" | cut -d ' ' -f 1)"
          cp "$pdf" "${RUNNER_TEMP}/first-build.pdf"

          python build_pdf.py
          test -s "$pdf"
          second_hash="$(sha256sum "$pdf" | cut -d ' ' -f 1)"

          test "$first_hash" = "$second_hash"
          cmp --silent "${RUNNER_TEMP}/first-build.pdf" "$pdf"
          printf '%s  %s\n' "$second_hash" "$(basename "$pdf")" > "$checksum"
          (
            cd "$(dirname "$pdf")"
            sha256sum --check "$(basename "$checksum")"
          )

      - name: Upload PDF and checksum
        uses: actions/upload-artifact@v4
        with:
          name: JURI-JANOVSKI-THESE-ZUR-GEBURT
          path: |
            output/pdf/JURI_JANOVSKI_THESE_ZUR_GEBURT.pdf
            output/pdf/JURI_JANOVSKI_THESE_ZUR_GEBURT.pdf.sha256
          if-no-files-found: error
          retention-days: 90
